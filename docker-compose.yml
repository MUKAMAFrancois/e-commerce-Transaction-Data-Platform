# data_generator -> MinIO -> Airflow -> PostgreSQL -> Metabase
# Credentials come from .env (see .env.example).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ecommerce/airflow:2.10.5

  # Set AIRFLOW_UID to your own `id -u` on Linux/CI or Airflow cannot write logs.
  user: "${AIRFLOW_UID:-50000}:0"

  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC

    # Pinned in .env: regenerating these orphans every stored connection.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth

    # endpoint_url is percent-encoded: it is a query value inside a conn URI.
    AIRFLOW_CONN_MINIO_S3: aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?endpoint_url=http%3A%2F%2Fminio%3A9000
    AIRFLOW_CONN_ANALYTICS_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    MINIO_ENDPOINT_URL: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}

    # This container is also the test runner, so it needs to reach Postgres and
    # Metabase directly rather than only through Airflow connections.
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    METABASE_URL: http://metabase:3000
    METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
    METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}

    # Airflow does not put AIRFLOW_HOME itself on sys.path; dags/ is needed so
    # tests can import common.quality outside a DAG run.
    PYTHONPATH: /opt/airflow:/opt/airflow/dags

  volumes:
    - ./dags:/opt/airflow/dags
    - ./data_generator:/opt/airflow/data_generator
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./tests:/opt/airflow/tests
    - ./pytest.ini:/opt/airflow/pytest.ini:ro
    - airflow_logs:/opt/airflow/logs

  networks:
    - ecommerce_network


services:
  # Two databases: ${POSTGRES_DB} for analytics, ${AIRFLOW_DB} for Airflow metadata.
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on first boot of an empty volume; `down -v` to re-run.
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ecommerce_network

    restart: unless-stopped


  minio:
    image: minio/minio:latest
    container_name: ecommerce_minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ecommerce_network

    restart: unless-stopped


  # Creates the raw landing bucket on a fresh volume.
  minio-init:
    image: minio/mc:latest
    container_name: ecommerce_minio_init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}

    # $$ defers expansion to the container's shell, not compose.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_RAW_BUCKET} &&
      echo 'bucket ready: '$${MINIO_RAW_BUCKET}
      "

    networks:
      - ecommerce_network

    restart: "no"


  # Builds the metadata schema and admin user; the other two gate on it.
  airflow-init:
    <<: *airflow-common
    container_name: ecommerce_airflow_init

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" \
          || echo "admin user already exists, skipping"

    restart: "no"


  airflow-webserver:
    <<: *airflow-common
    container_name: ecommerce_airflow_webserver

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    command: webserver

    ports:
      - "${AIRFLOW_HOST_PORT}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped


  # Without this nothing ever executes, however healthy the UI looks.
  airflow-scheduler:
    <<: *airflow-common
    container_name: ecommerce_airflow_scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    command: scheduler

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce_metabase

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Explicit so it cannot drift from the mount path below.
      MB_DB_FILE: /metabase.db/metabase.db

    ports:
      - "${METABASE_HOST_PORT}:3000"

    volumes:
      - metabase_data:/metabase.db

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - ecommerce_network

    restart: unless-stopped


  # Creates the admin user, the Postgres connection, the KPI cards and the
  # dashboard. Idempotent, so it reruns harmlessly on every `up`.
  metabase-init:
    image: ecommerce/airflow:2.10.5
    container_name: ecommerce_metabase_init

    depends_on:
      metabase:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      # Without this the script's output only appears when it exits, which
      # makes a slow or stuck provisioning run impossible to diagnose.
      PYTHONUNBUFFERED: "1"
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./config:/opt/airflow/config

    entrypoint: python /opt/airflow/config/metabase/provision.py

    networks:
      - ecommerce_network

    restart: "no"


volumes:
  postgres_data:
    name: ecommerce_postgres_data

  minio_data:
    name: ecommerce_minio_data

  airflow_logs:
    name: ecommerce_airflow_logs

  metabase_data:
    name: ecommerce_metabase_data


# Containers reach each other by service name, never localhost.

networks:
  ecommerce_network:
    name: ecommerce_network
    driver: bridge

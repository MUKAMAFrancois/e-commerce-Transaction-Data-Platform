name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          # dags/ holds the common package the validation rules live in.
          PYTHONPATH: .:dags
        run: pytest -m "not integration" -v

  integration:
    name: Data flow validation
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^AIRFLOW_FERNET_KEY=.*|AIRFLOW_FERNET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          sed -i "s|^AIRFLOW_SECRET_KEY=.*|AIRFLOW_SECRET_KEY=$(openssl rand -hex 32)|" .env
          # Bind-mounted paths must be writable by the runner's own user.
          sed -i "s|^AIRFLOW_UID=.*|AIRFLOW_UID=$(id -u)|" .env

      - name: Build images
        run: docker compose build

      - name: Start the platform
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          containers="ecommerce_postgres ecommerce_minio ecommerce_airflow_webserver ecommerce_airflow_scheduler ecommerce_metabase"
          deadline=$((SECONDS + 600))
          until [ "$(docker inspect -f '{{.State.Health.Status}}' $containers 2>/dev/null | sort -u)" = "healthy" ]; do
            if [ $SECONDS -gt $deadline ]; then
              echo "services did not become healthy in time"
              docker compose ps
              exit 1
            fi
            sleep 10
          done
          # metabase-init runs at startup and must finish before the step below
          # re-runs it, or two provisioners race each other.
          until [ "$(docker inspect -f '{{.State.Status}}' ecommerce_metabase_init)" = "exited" ]; do
            [ $SECONDS -gt $deadline ] && { docker compose logs metabase-init; exit 1; }
            sleep 5
          done
          docker compose ps

      # MinIO -> Airflow -> PostgreSQL, driven the same way a user would.
      - name: Generate data into MinIO
        run: docker compose exec -T airflow-scheduler python -m data_generator.synthetic --dest minio

      - name: Run the ingestion DAG
        run: docker compose exec -T airflow-scheduler airflow dags test ecommerce_ingestion 2027-01-01

      # The first provisioning ran before the DAG created any tables, so sync again.
      - name: Re-provision Metabase
        run: docker compose run --rm metabase-init

      - name: Run integration tests
        run: docker compose exec -T -w /opt/airflow airflow-scheduler pytest -m integration -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
